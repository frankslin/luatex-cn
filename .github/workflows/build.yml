name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          cache: true
          packages: |
            scheme-basic
            l3build
            luaotfload
            luatex
            ctablestack
            fontspec
            latex-bin
            ctex
            markdown
            geometry

      - name: Install system dependencies
        run: sudo apt-get install -y zip unzip

      - name: Build CTAN package
        run: |
          texlua build.lua ctan

      - name: Deploy to ctan branch
        run: |
          mkdir out
          for d in build/distrib/ctan build/ctan; do
            if [ -d "$d/luatex-cn" ]; then
              echo "Found staging area in $d"
              cp -r $d/* out/
              break
            fi
          done
          ls -R out

      - name: Push to ctan branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: ctan
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "Release ${{ github.ref_name }} [skip ci]"

      - name: Prepare release asset
        run: |
          # 发布资产直接用 build.lua 打出来的上传包，不要在这里另起一个 zip：
          # 本地 `texlua build.lua ctan` 与 CI、与上传 CTAN 的文件必须是同一个。
          # 包内含 doc/（wiki PDF 手册）：手动安装后放入 texmf 文档树，
          # texdoc luatex-cn 才能弹出 PDF（fix #102）
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 VERSION 文件 (${VERSION}) 不一致"
            exit 1
          fi
          ZIP="luatex-cn-v${VERSION}.zip"
          if [ ! -f "$ZIP" ]; then
            cp "build/distrib/upload/${ZIP}" .
          fi
          echo "Release asset: $ZIP"

      - name: Verify CTAN package structure
        run: |
          # CTAN 的硬性要求：解包后顶层是唯一目录 luatex-cn/，
          # README.md 在 luatex-cn/ 顶层（不能只在 doc/ 下），源码在 tex/、文档在 doc/
          set -euo pipefail
          ZIP="luatex-cn-${GITHUB_REF_NAME}.zip"
          unzip -Z1 "$ZIP" > manifest.txt
          cat manifest.txt
          fail=0
          for entry in "luatex-cn/README.md" "luatex-cn/tex/" "luatex-cn/doc/"; do
            if [ "$(grep -cxF "$entry" manifest.txt || true)" -eq 0 ]; then
              echo "::error::缺少 $entry"
              fail=1
            fi
          done
          if [ "$(grep -cv '^luatex-cn/' manifest.txt || true)" -ne 0 ]; then
            echo "::error::存在 luatex-cn/ 之外的顶层条目"
            fail=1
          fi
          if [ "$(grep -cxF 'luatex-cn/doc/README.md' manifest.txt || true)" -ne 0 ]; then
            echo "::error::README.md 不应出现在 doc/ 下"
            fail=1
          fi
          rm -f manifest.txt
          exit $fail

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          # Match from "## [VERSION]" to the next "## [" or end of file
          BODY=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)
          # Extract the date from the heading
          DATE=$(grep -oP "^## \[$VERSION\] - \K.*" CHANGELOG.md || echo "")
          TITLE="${GITHUB_REF_NAME} - ${DATE}"
          # Write to outputs using delimiter
          {
            echo "title=${TITLE}"
            echo "body<<CHANGELOG_EOF"
            echo "${BODY}"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.changelog.outputs.title }}
          body: ${{ steps.changelog.outputs.body }}
          files: luatex-cn-${{ github.ref_name }}.zip
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
