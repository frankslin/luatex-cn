name: Test

on:
  pull_request:
  push:
    branches: [main, dev]

# 测试 workflow 只需要读代码；显式声明避免继承更宽的默认权限
permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install TeX Live (texlua only)
        uses: TeX-Live/setup-texlive-action@v3
        with:
          cache: true
          packages: |
            scheme-basic
            luatex

      - name: Run unit tests
        run: texlua test/run_all.lua

  regression-test:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install TeX Live
        uses: TeX-Live/setup-texlive-action@v3
        with:
          cache: true
          packages: |
            scheme-basic
            latex-bin
            luatex
            luaotfload
            luatexbase
            ctablestack
            fontspec
            iftex
            geometry
            graphics
            enumitem
            environ
            trimspaces
            eso-pic
            xkeyval
            etoolbox
            l3kernel
            l3packages
            showframe
            pgf
            xcolor

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil python3-numpy

      - name: Cache test fonts
        uses: actions/cache@v4
        with:
          path: test/fonts
          key: test-fonts-${{ hashFiles('scripts/download_test_fonts.sh') }}

      - name: Download test fonts
        run: sh scripts/download_test_fonts.sh

      - name: Link luatex-cn into TEXMFHOME
        run: |
          mkdir -p ~/texmf/tex/lualatex
          ln -s "$GITHUB_WORKSPACE/tex" ~/texmf/tex/lualatex/luatex-cn

      - name: Run regression tests
        run: python3 test/regression_test.py check
