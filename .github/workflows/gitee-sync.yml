name: Sync to Gitee

concurrency:
  group: gitee-sync
  cancel-in-progress: true

on:
  push:
    branches:
      - main

jobs:
  repo-sync:
    # 只在 open-guji 主仓库运行，fork 上没有 Gitee 密钥也无需同步
    if: github.repository_owner == 'open-guji'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.GITEE_PRIVATE_KEY }}

      - name: Add Gitee to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts

      - name: Prepare for Gitee Sync
        run: bash scripts/prepare-gitee-sync.sh

      - name: Push to Gitee
        run: |
          git remote add gitee git@gitee.com:open-guji/${{ github.event.repository.name }}.git
          git push -f gitee gitee-sync:main
        continue-on-error: true